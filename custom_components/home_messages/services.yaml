send:
  name: Send message
  description: Individual targets use iMessage with optional SMS fallback after a definite pre-send failure. Configured groups use iMessage only.
  fields:
    text:
      name: Message
      description: Message text to send.
      required: true
      example: The washing machine has finished.
      selector:
        text:
          multiline: true
    initials:
      name: Recipients
      description: Commas separate targets. Hyphens select an exact configured group; without its binding, members are sent individually (BB-CC becomes BB,CC).
      required: true
      example: BB-CC,AA
      selector:
        text:
    request_id:
      name: Request ID
      description: Optional unique ID for this message. Reuse the same ID only when retrying the same request.
      required: false
      example: washing-machine-20261002-180000
      selector:
        text:
    dry_run:
      name: Validate only
      description: Validate and preview effective destinations without sending. Missing group bindings appear as individual targets. No live membership or proxy permission checks.
      required: false
      default: false
      selector:
        boolean:
test_connection:
  name: Test connection
  description: Read the iMessage proxy status without sending a message or SMS.
